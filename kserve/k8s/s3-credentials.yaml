# storage-initializer 가 SeaweedFS(S3 호환)에서 모델 파일을 받을 때 쓰는 키와 접속 정보
# 키는 kubeflow/manifests 기본값 (책과 같음). Transformer 도 Feast 설정을 받을 때 같은 Secret 을 씀
apiVersion: v1
kind: Secret
metadata:
  name: kserve-s3
  namespace: mlops
  annotations:
    serving.kserve.io/s3-endpoint: seaweedfs.kubeflow.svc.cluster.local:9000
    serving.kserve.io/s3-usehttps: "0"
    serving.kserve.io/s3-region: us-east-1
stringData:
  AWS_ACCESS_KEY_ID: minio
  AWS_SECRET_ACCESS_KEY: minio123
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: kserve-s3
  namespace: mlops
secrets:
- name: kserve-s3
